<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%95%B6%EF%B8%8F</text></svg>" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var savedNav = localStorage.getItem("pagelm:nav-collapsed");
        var navCollapsed = savedNav !== null ? savedNav === "1" : window.innerWidth < 1024;
        if (navCollapsed) document.documentElement.classList.add("nav-collapsed");
      } catch (e) { }
      try {
        var savedTheme = localStorage.getItem("pagelm:theme");
        var isDark = savedTheme
          ? savedTheme === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      } catch (e) { }
    </script>
  <title>PageLM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
